version: "3.8"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sse-server
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_APP_API_URL: https://sseapi.sanjaykumarp.info
    container_name: sse-client
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - server

networks:
  app-network:
    driver: bridge
