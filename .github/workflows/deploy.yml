name: Deploy to EC2

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  deploy:
    # Only run if PR was merged (not just closed)
    if: github.event.pull_request.merged == true
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        run: |
          echo "🚀 Starting deployment to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Actions - PR #${{ github.event.pull_request.number }}" \
            --parameters 'commands=[
              "set -e",
              "echo \"📦 Deployment started at $(date)\"",
              "echo \"═══════════════════════════════════════\"",
              "cd /home/ec2-user/app",
              "echo \"📥 Fetching latest code from main branch...\"",
              "sudo -u ec2-user git fetch origin",
              "sudo -u ec2-user git reset --hard origin/main",
              "sudo -u ec2-user git pull origin main",
              "echo \"Current commit: $(git rev-parse --short HEAD)\"",
              "echo \"═══════════════════════════════════════\"",
              "echo \"🐳 Stopping containers...\"",
              "docker-compose down || true",
              "echo \"🔨 Building Docker images...\"",
              "docker-compose build --no-cache",
              "echo \"🚀 Starting containers...\"",
              "docker-compose up -d",
              "echo \"═══════════════════════════════════════\"",
              "echo \"✅ Verifying deployment...\"",
              "sleep 5",
              "docker-compose ps",
              "echo \"═══════════════════════════════════════\"",
              "echo \"🧹 Cleaning up old Docker images...\"",
              "docker image prune -af --filter \"until=72h\" || true",
              "echo \"═══════════════════════════════════════\"",
              "echo \"✅ Deployment completed successfully at $(date)\"",
              "echo \"🌐 Client: https://sse.sanjaykumarp.info\"",
              "echo \"🌐 API: https://sseapi.sanjaykumarp.info\""
            ]' \
            --output text \
            --query 'Command.CommandId')

          echo "📋 Command ID: $COMMAND_ID"
          echo "⏳ Waiting for deployment to complete..."

          # Wait for command with polling (no --timeout flag)
          MAX_ATTEMPTS=60  # 10 minutes (60 * 10 seconds)
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            
            echo "Status: $STATUS (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Command completed successfully"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Command failed with status: $STATUS"
              exit 1
            fi
            
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "❌ Deployment timed out after 10 minutes"
            exit 1
          fi

          # Get command output
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' \
            --output text)

          echo "📄 Deployment Output:"
          echo "═══════════════════════════════════════"
          echo "$OUTPUT"
          echo "═══════════════════════════════════════"

          # Check for errors
          ERROR_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardErrorContent' \
            --output text)

          if [ ! -z "$ERROR_OUTPUT" ] && [ "$ERROR_OUTPUT" != "None" ]; then
            echo "⚠️ Deployment errors detected:"
            echo "$ERROR_OUTPUT"
            exit 1
          fi

          echo "🎉 Deployment successful!"

      - name: Deployment Summary
        if: success()
        run: |
          echo "### ✅ Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR #${{ github.event.pull_request.number }}**: ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed to:**" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Client: https://sse.sanjaykumarp.info" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 API: https://sseapi.sanjaykumarp.info" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR #${{ github.event.pull_request.number }}**: ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
